<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @keyframes boltPulse {
        0%   { opacity: 1; }
        50%  { opacity: 0.55; }
        100% { opacity: 1; }
      }
      @keyframes ringPulse {
        0%   { opacity: 0.6; stroke-width: 3; }
        50%  { opacity: 1;   stroke-width: 4.5; }
        100% { opacity: 0.6; stroke-width: 3; }
      }
      @keyframes glowExpand {
        0%   { stdDeviation: 2; }
        50%  { stdDeviation: 4; }
        100% { stdDeviation: 2; }
      }
      .bolt { animation: boltPulse 2.4s ease-in-out infinite; }
      .ring { animation: ringPulse 2.4s ease-in-out infinite; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F1E"/>
      <stop offset="100%" stop-color="#161828"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8a"/>
      <stop offset="100%" stop-color="#E94560"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Soft bloom behind bolt -->
  <path d="M60 12 L36 52 H53 L40 88 L64 48 H47 Z"
    fill="#E94560" opacity="0.18" filter="url(#glowBig)" class="bolt"/>

  <!-- Accent border ring -->
  <rect class="ring" width="100" height="100" rx="20" fill="none"
    stroke="#E94560" stroke-width="3" opacity="0.6" filter="url(#glow)"/>

  <!-- Lightning bolt -->
  <path class="bolt" d="M60 12 L36 52 H53 L40 88 L64 48 H47 Z"
    fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Subtle inner highlight on bolt -->
  <path d="M56 18 L38 52 H52 L42 78"
    fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
</svg>
