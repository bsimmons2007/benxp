<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Arena Clash</title>
  <!-- Share Tech Mono — alien command console font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0d0e;
    }

    body {
      width: 100%;
      height: 100%;
      background: #0a0d0e;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Phaser places the canvas as a direct child of the parent element.
       Ensure it never grows beyond the viewport and stays centred. */
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>

  <!-- Phaser 3 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Config must load before any scene references ARENA, COLORS, etc. -->
  <script src="src/config.js"></script>

  <!-- Unit stat definitions — loaded before scenes that reference UNITS / DEFAULT_DECK -->
  <script src="src/units/UnitDefinitions.js"></script>

  <!-- Scenes in the order Phaser needs them registered -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/UIScene.js"></script>
  <script src="src/scenes/ResultScene.js"></script>

  <script>
    window.__phaserGame = new Phaser.Game({
      type:            Phaser.AUTO,
      width:           ARENA.width,
      height:          ARENA.height,
      backgroundColor: '#0a0d0e',   // near-black alien rock ground
      parent:          document.body,
      // Render at the device's native pixel density so text is crisp on
      // HiDPI / Retina screens instead of blurry from CSS up-scaling.
      resolution:      window.devicePixelRatio || 1,
      antialias:       true,
      scale: {
        mode:       Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
      },
      // Scenes listed in the order they can be started; BootScene runs first.
      scene: [BootScene, MenuScene, GameScene, UIScene, ResultScene],
    });
  </script>

</body>
</html>
