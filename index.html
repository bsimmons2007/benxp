<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://you-xp.com" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d1a" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Track every gym set, mile run, book finished, and game won. Real life earns real XP — turn your daily habits into a personal RPG and level up your life." />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src  'self' 'unsafe-inline';
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' data: https://fonts.gstatic.com;
      img-src     'self' data: blob: https://*.supabase.co;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vitals.vercel-insights.com https://va.vercel-scripts.com https://o*.ingest.sentry.io;
      media-src   'self';
      object-src  'none';
      frame-ancestors 'none';
    " />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YouXP" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="YouXP" />
    <meta property="og:title"       content="YouXP — Level up your life" />
    <meta property="og:description" content="Real life earns real XP. Track every gym set, mile run, book finished, and game won. Turn your daily habits into a personal RPG." />
    <meta property="og:url"         content="https://you-xp.com" />
    <meta property="og:image"       content="https://you-xp.com/og-image.png" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="YouXP — Level up your life" />
    <meta name="twitter:description" content="Real life earns real XP. Track every gym set, mile run, book finished, and game won." />
    <meta name="twitter:image"       content="https://you-xp.com/og-image.png" />

    <title>YouXP — Level up your life</title>

    <!-- Fonts: Space Grotesk (display) + JetBrains Mono (stats/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Boot loader — inline styles, CSP allows unsafe-inline -->
    <style>
      /* ── Loader shell — light mode default ── */
      #lxp-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #f3efe6;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 32px;
        transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      }
      #lxp-loader.lxp-exit { transform: translateY(-100%); }

      /* dark override — applied by loader.js when youxp-mode=dark */
      #lxp-loader.lxp-dark { background: #0d0d1a; }

      /* ── WordMark ── */
      #lxp-title {
        display: flex; align-items: baseline; gap: 0;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: clamp(36px, 8vw, 64px);
        font-weight: 700;
        letter-spacing: -0.08em;
        position: relative; z-index: 1;
      }
      #lxp-title .lxp-you {
        color: #1d1d1f;
        opacity: 0; transform: translateY(-24px);
        transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      }
      #lxp-loader.lxp-dark #lxp-title .lxp-you { color: #f3efe6; }
      #lxp-title .lxp-xp {
        color: #e5443f;
        opacity: 0; transform: translateY(24px);
        transition: opacity 0.3s ease 0.18s, transform 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.18s;
      }
      #lxp-title.lxp-v .lxp-you,
      #lxp-title.lxp-v .lxp-xp { opacity: 1; transform: translateY(0); }

      /* ── Progress bar ── */
      #lxp-bar-wrap {
        display: flex; flex-direction: column; align-items: center; gap: 10;
        position: relative; z-index: 1;
      }
      #lxp-bar-track {
        width: min(260px, 72vw); height: 2px;
        background: rgba(0,0,0,0.08);
        border-radius: 999px; overflow: hidden;
      }
      #lxp-loader.lxp-dark #lxp-bar-track { background: rgba(255,255,255,0.08); }
      #lxp-bar {
        height: 100%; width: 0%;
        background: #e5443f;
        border-radius: 999px;
        transition: width 1.8s cubic-bezier(0.4,0,0.2,1);
      }

      /* ── Sub-label ── */
      #lxp-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: rgba(0,0,0,0.25);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      #lxp-loader.lxp-dark #lxp-sub { color: rgba(255,255,255,0.2); }
      .lxp-blink { animation: lxp-blink 0.9s step-end infinite; }
      @keyframes lxp-blink { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        #lxp-loader { transition: none; }
        #lxp-loader.lxp-exit { transform: none; opacity: 0; }
        #lxp-title .lxp-you,
        #lxp-title .lxp-xp { transition: none; opacity: 1; transform: none; }
        #lxp-bar { transition: none; }
        .lxp-blink { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Loader lives outside #root — React never touches it -->
    <div id="lxp-loader" aria-hidden="true">
      <div id="lxp-title">
        <span class="lxp-you">you</span><span class="lxp-xp">xp</span>
      </div>
      <div id="lxp-bar-wrap">
        <div id="lxp-bar-track"><div id="lxp-bar"></div></div>
        <div id="lxp-sub">initializing...<span class="lxp-blink">_</span></div>
      </div>
    </div>

    <div id="root"></div>
    <script src="/loader.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
